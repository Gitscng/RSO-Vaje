jo.","Poznajo pomen uporabe ve\u010Dnitnosti.","Prepoznavajo osnovne razvr\u0161\u010Devalne algoritme za procese.","Razumejo problem smrtnega objema.","Obrazlo\u017Eijo vlogo enote za upravljanje s pomnilnikom (MMU).","Poznajo delovanje naslovnega dekodiranja.","Opisujejo fizi\u010Dno in logi\u010Dno organizacijo podatkovnih nosilcev.","Razlikujejo sklenjeni, kazal\u010Dni in indeksni na\u010Din zapisa.","Razumejo fragmentacijo diska in izvedejo defragmentacijo.","Poznajo razli\u010Dne na\u010Dine shranjevanja podatkov (RAID).","Poznajo stre\u017Eni\u0161ki OS, OS v realnem \u010Dasu, navidezno okolje.","Name\u0161\u010Dajo in konfigurirajo sistem navideznega okolja.","Uporabljajo napredne ukaze ukazne lupine.","Napi\u0161ejo, testirajo in uporabijo ukazne datoteke.","Razumejo pomen ustvarjanja varnostnih kopij.","Poznajo na\u010Dine za\u0161\u010Dite dostopa do podatkov.","Izdelajo celovito politiko varovanja podatkov."]},{id:"prog",naziv:"Napredno programiranje z elementi na\u010Drtovanja",ure:35,status:"ready",cilji:["Uporabljajo elemente OOP (razred, objekt, metoda, dedovanje, ve\u010Dobli\u010Dnost).","Spoznavajo principe specializacije in posplo\u0161evanja.","Uporabljajo abstraktne razrede in vmesnike.","Izdelajo diagram primera rabe in razredni diagram (UML).","Spoznavajo diagram aktivnosti, objektni in sekven\u010Dni diagram, diagram stanj.","Uporabljajo orodja za vizualno programiranje (NetBeans, Visual Studio, Eclipse).","Spoznavajo zgradbo in vrste programskih projektov.","Dostopajo do oddaljenih repozitorijev, delijo in uveljavljajo kodo.","Sodelujejo v delovnih skupinah na skupnih projektih.","Uporabljajo grafi\u010Dne gradnike za izdelavo GUI.","Razvijejo enostavno aplikacijo z grafi\u010Dnim vmesnikom.","Kriti\u010Dno ovrednotijo kakovost vmesnika in robustnost aplikacije.","Vzpostavljajo povezavo s podatkovno zbirko in obravnavajo napake.","Pi\u0161ejo enostavne programe za delo s podatkovno zbirko."]}],If=[{id:"splet",naziv:"Na\u010Drtovanje in ra akcijo z uporabniki prek videa in spletnih storitev.","Analizirajo vpliv vsebine videa na skupnost."]},{id:"3d",naziv:"3D modeliranje in tisk",ure:35,status:"outline",cilji:["Spoznavajo mo\u017Enosti, ki jih ponuja 3D tisk.","Uporabljajo orodja za modeliranje.","Izdelujejo 3D modele in jih natisnejo.","Prepoznavajo in odpravljajo napake na 3D modelih.","Uporabljajo razli\u010Dne tehnike modeliranja."]},{id:"vrar",naziv:"Navidezna in obogatena resni\u010Dnost (VR/AR)",ure:35,status:"outline",cilji:["Spoznavajo zna\u010Dilnosti in nevarnosti uporabe VR/AR.","Pripravljajo in uporabljajo opremo in orodja za VR/AR.","Pripravljene modele vklju\u010Dujejo v VR/AR.","Programirajo dejavnosti v VR/AR.","Izdelujejo, izvajajo in predstavljajo projekte z VR/AR."]},{id:"dinstr",naziv:"Dinami\u010Dne strukture",ure:35,status:"outline",cilji:["Spoznavajo razli\u010Dne vrste podatkovnih struktur.","Uporabijo preproste podatkovne strukture in izvajajo tipi\u010Dne operacije.","Ustvarijo sklad in vrsto ter delajo z elementi.","Zgradijo seznam poljubnih elementov (iskanje, dodajanje, brisanje).","Uporabijo binarno iskalno drevo za razvr\u0161\u010Danje.","Spoznajo uravnote\u017Eena iskalna drevesa (AVL, rde\u010De-\u010Drno).","Spoznajo realizacije dinami\u010Dnih struktur v izbranem jeziku."]},{id:"ai",naziv:"Umetna inteligenca",ure:35,status:"outline",cilji:["Razlo\u017Eijo pojem umetne inteligence in podro\u010Dja uporabe.","Razlo\u017Eijo pomen pojmov strojno u\u010Denje, globoko u\u010Denje, nevronske mre\u017Ee.","Identificirajo probleme, re\u0161ljive z umetno inteligenco.","Predstavijo klasifikacijske tehnike in odlo\u010Ditvena drevesa.","Lo\u010Dijo med nadzorovanim in nenadzorovanim strojnim u\u010Denjem.","Uporabijo preproste tehnike umetne inteligence na prakti\u010Dnih primerih.","Predstavijo probleme in eti\u010Dne pomisleke s podro\u010Dja umetne inteligence."]},{id:"progsist",naziv:"Programiranje ra\u010Dunalni\u0161kih sistemov in omre\u017Eij",ure:35,status:"outline",cilji:["Preiskujejo zagonske datoteke vgradnih sistemov/mikrokrmilnikov.","Pi\u0161ejo programe z uporabo pomnilni\u0161ko preslikane V/I naprave (GPIO).","Sestavljajo prekinitveno servisne podprograme za GPIO.","Uporabljajo komunikacijska vmesnika USART in I2C za branje tipal.","Pi\u0161ejo programe z uporabo vti\u010Dnic za vzpostavljanje omre\u017Enih povezav.","Implementirajo model stre\u017Enik/odjemalec.","Sestavljajo, kodirajo in presku\u0161ajo preprost stre\u017Enik HTTP.","Uporabijo ali izdelajo preprost API za prenos in shranjevanje podatkov."]},{id:"projekt",naziv:"Projektno/raziskovalno delo",ure:35,status:"outline",cilji:["Skupaj z mentorjem identificirajo raziskovalni izziv.","Na\u010Drtujejo in izvedejo projektno/raziskovalno delo.","Oblikujejo ugotovitve in sklepe.","Na razli\u010Dne na\u010Dine predstavijo projektno/raziskovalno delo."]}],At=[...Fr,...If],no=Object.fromEntries(At.map(a=>[a.id,a])),pg=[{id:"t1",naslov:"Harvardska in von Neumannova arhitektura",diagram:"harvard-vn",zaUcitelja:"Pogosta zmota dijakov: mislijo, da je Harvardska arhitektura preprosto 'hitrej\u0161a razli\u010Dica', ne pa arhitektura z lo\u010Denimi pomnilniki. Poudarite fizi\u010Dno lo\u010Ditev vodil, ne hitrosti takta. Dober demo: primerjajte blok shemo mikrokrmilnika (npr. Arduino/ATmega, harvardska) z blok shemo namiznega PC-ja (modificirana harvardska navzven kot von Neumann).",odstavki:["Von Neumannova arhitektura uporablja en sam pomnilni\u0161ki prostor za ukaze in podatke ter eno skupno vodilo. Posledica je t. i. von Neumannovo ozko grlo (angl. bottleneck): CPE ne more v istem taktu hkrati prebrati naslednjega ukaza in dostopati do podatka, ker si oba dostopa delita isto vodilo.","Harvardska arhitektura ima lo\u010Dena pomnilni\u0161ka prostora \u2014 programski pomnilnik (ROM/Flash) za strojno kodo in podatkovni pomnilnik (RAM) za spremenljivke \u2014 ter lo\u010Deni naslovni in podatkovni vodili. Zato lahko procesor hkrati bere naslednji ukaz in zapisuje oz. bere trenutne podatke, kar pove\u010Da prepustnost. Arhitektura je zna\u010Dilna za mikrokrmilnike (npr. AVR, PIC).","Sodobni namizni procesorji (x86, ARM) uporabljajo modificirano harvardsko arhitekturo: navzven imajo en sam naslovni prostor (kot pri von Neumannu), navznoter pa lo\u010Dena predpomnilnika za ukaze (I-cache) in podatke (D-cache) ter tako zdru\u017Eijo prilagodljivost von Neumanna s hitrostjo Harvarda."]},{id:"t2",naslov:"Pomnilni\u0161ka hierarhija: RAM, ROM, SRAM/DRAM, VRAM",diagram:"piramida",zaUcitelja:"Dijaki pogosto zamenjajo pojma hitrost in kapaciteta pomnilnika \u2014 poudarite obratno razmerje (SRAM je hiter, a majhen; sekundarni pomnilnik je velik, a po\u010Dasnej\u0161i). \u010Ce imate na voljo star RAM modul in BIOS \u010Dip (ROM), ju prinesite za otip \u2014 konkretna izku\u0161nja si dijaki bolje zapomnijo kot abstrakcijo.",odstavki:["RAM (Random Access Memory) je begasljiv (volatile) pomnilnik: ob izklopu napajanja se vsebina izgubi. Vanj se shranjujejo odprte aplikacije, zagnani procesi, predpomnilnik brskalnika, neshranjeni podatki dokumentov in delovni pomnilnik operacijskega sistema.","ROM (Read-Only Memory) je energijsko neodvisen (non-volatile) pomnilnik. Hrani vdelano programsko opremo BIOS/UEFI, zagonske ukaze, diagnostiko strojne opreme, konfiguracijo naprave in nizkonivojske gonilnike \u2014 vsebino, ki mora pre\u017Eiveti izklop.","SRAM (Static RAM) je najhitrej\u0161i, a drag in majhne kapacitete \u2014 uporablja se za predpomnilnik procesorja (L1, L2, L3). DRAM (Dynamic RAM) je po\u010Dasnej\u0161i, a cenej\u0161i in ve\u010Dje kapacitete \u2014 to je glavni sistemski (delovni) pomnilnik. Standarda DDR4 in DDR5 sta sodobni razli\u010Dici DRAM-a, pri \u010Demer vsaka nova generacija podvoji hitrost prenosa podatkov.","VRAM (Video RAM) je specializiran DRAM na grafi\u010Dni kartici, namenjen shranjevanju tekstur in slikovnih okvirjev (frames) za prikaz na zaslonu."]},{id:"t3",naslov:"Zgradba ra\u010Dunalni\u0161kega ukaza in format ukaza",diagram:"format",zaUcitelja:"Ta del je precej abstrakten. Priporo\u010Damo, da dijaki najprej sami poskusijo dekodirati vajo V8, preden poka\u017Eete re\u0161itev na tabli \u2014 samostojen poskus (tudi napa\u010Den) znatno izbolj\u0161a razumevanje. \u010Casovna ocena: pribli\u017Eno 15 minut razlage + 15 minut samostojne vaje.",odstavki:["Vsak strojni ukaz sestavljata operacija (npr. se\u0161tevanje ADD, premik MOV, skok JMP), ki pove procesorju, katero dejanje mora izvesti, in operandi, ki dolo\u010Dajo podatke ali njihove lokacije. Podatek se lahko nahaja neposredno v ukazu, v registru ali na pomnilni\u0161kem naslovu.","Strojni cikel ukaza je \u010Das, v katerem procesor ukaz prebere (fetch), dekodira (decode) in izvede (execute). Ukazi so v pomnilniku shranjeni zaporedoma po nara\u0161\u010Dajo\u010Dih naslovih; programski \u0161tevec (PC) po vsakem ukazu samodejno ka\u017Ee na naslednjega, razen ob skoku ali klicu podprograma.","Format ukaza \u2014 delitev bitov ukaza na polja \u2014 je odvisen od \u0161tevila operandov, \u0161tevila registrov v CPE in velikosti pomnilni\u0161ke besede. Ve\u010Dina osnovnih operacij ima do tri operande (dva vhodna in rezultat); ra\u010Dunalnike z m operandi imenujemo m-naslovni ra\u010Dunalniki."]},{id:"t4",naslov:"CISC in RISC",diagram:null,zaUcitelja:"Past: dijaki pogosto sklepajo, da je RISC 'slab\u0161i', ker ima manj ukazov. Poudarite, da gre za filozofijo enostavnosti in hitrosti, ne za manj\u0161o zmogljivost. Dobra izto\u010Dnica za razpravo: pametni telefoni in tablice (ARM) so RISC, kar dijaki pove\u017Eejo z vsakdanjo izku\u0161njo.",odstavki:["CISC (Complex Instruction Set Computer) vsebuje obse\u017Een nabor kompleksnih ukazov spremenljive dol\u017Eine. En sam ukaz lahko opravi ve\u010D korakov hkrati, npr. prenos iz pomnilnika in aritmeti\u010Dno operacijo. Zna\u010Dilen predstavnik je arhitektura x86.","RISC (Reduced Instruction Set Computer) uporablja manj\u0161e \u0161tevilo preprostih, enotno dolgih in optimiziranih ukazov. Ve\u010Dina ukazov se izvede v enem strojnem ciklu, poudarek pa je na delu z registri namesto s pomnilnikom. Zna\u010Dilna predstavnika sta ARM in AVR.","V praksi se pristopa prepletata: sodobni procesorji x86 interno prevajajo CISC-ukaze v enostavnej\u0161e, RISC-podobne mikrooperacije, s \u010Dimer izkoristijo prednosti obeh svetov."]},{id:"t5",naslov:"Programski model mikrokrmilnika in registri",diagram:null,zaUcitelja:"SP in PC dijaki pogosto zamenjujejo med seboj. Priporo\u010Dena analogija: PC je kazalec na trenutno stran v knjigi (kaj berem zdaj), SP pa kazalec na vrh kupa listov na mizi (kam odlo\u017Eim naslednji podatek/naslov).",odstavki:["Programski model je logi\u010Dni pogled programerja na mikrokrmilnik \u2014 vklju\u010Duje vse registre in naslovne prostore, s katerimi programer neposredno dela, ne glede na notranjo strojno izvedbo.","Splo\u0161ni registri (GPR) so izjemno hitre celice znotraj CPE za za\u010Dasno shranjevanje podatkov, velikosti 8, 16, 32 ali 64 bitov. Programski \u0161tevec (PC) vedno ka\u017Ee na pomnilni\u0161ki naslov naslednjega ukaza. Statusni register (SREG) v obliki bitnih zastavic (Zero, Carry, Negative, Overflow) shranjuje stanje zadnje operacije. Skladovni kazalec (SP) ka\u017Ee na vrh sklada v RAM-u in je klju\u010Den pri klicu podprogramov, saj nanj procesor odlo\u017Ei povratni naslov."]},{id:"t6",naslov:"Na\u010Dini naslavljanja podatkov",diagram:null,zaUcitelja:"Najte\u017Eji del za dijake je razlika med neposrednim/registrskim in posrednim registrskim naslavljanjem. Na tablo nari\u0161ite: register \u2192 vsebuje naslov \u2192 pu\u0161\u010Dica ka\u017Ee na podatek v pomnilniku. Vizualna pu\u0161\u010Dica pogosto re\u0161i zmedo hitreje kot besedna razlaga.",odstavki:["Vsebovano naslavljanje (angl. inherent): operand je del same operacijske kode, dodaten naslov ni potreben \u2014 primer je ukaz NOP.","Takoj\u0161nje naslavljanje (angl. immediate): konkretna konstanta je zapisana neposredno znotraj ukaza, npr. ADDI R1, R2, #5.","Neposredno/registrsko naslavljanje (angl. direct): operand je v registru ali na fiksnem pomnilni\u0161kem naslovu, ki je zapisan v samem ukazu, npr. ADD R3, R2, R1 (register) ali LOAD R1, 1000 (pomnilni\u0161ki naslov).","Posredno registrsko naslavljanje (angl. indirect): register ne vsebuje podatka, temve\u010D naslov, ki ka\u017Ee na podatek v RAM-u, npr. LW R1, 0(R2). Ta na\u010Din omogo\u010Da u\u010Dinkovito delo s tabelami, kazalci in dinami\u010Dnimi strukturami.","Izbira na\u010Dina naslavljanja je kompromis med gostoto/prilagodljivostjo kode in hitrostjo dekodiranja ukaza \u2014 zato arhitekture praviloma ponujajo ve\u010D na\u010Dinov hkrati."]},{id:"t7",naslov:"Priklapljanje vhodno-izhodnih naprav",diagram:null,zaUcitelja:"Pove\u017Eite z zgodovino starih vzporednih (LPT) in serijskih (COM) vrat na PC-ju \u2014 dijaki jih praviloma ne poznajo iz lastne izku\u0161nje, zato pomaga fotografija stare zadnje stranice namiznega ra\u010Dunalnika za kontekst.",odstavki:["Pri pomnilni\u0161ko preslikanem V/I (angl. memory-mapped I/O) se registri naprave nahajajo v istem naslovnem prostoru kot obi\u010Dajni RAM, zato do njih dostopamo z obi\u010Dajnimi ukazi za delo s pomnilnikom (npr. LOAD/STORE, MOV).","Pri lo\u010Denem V/I (angl. isolated/port-mapped I/O) ima V/I vmesnik svoj, lo\u010Den naslovni prostor, do njega pa dostopamo le s posebnimi ukazi (npr. IN, OUT). Ta pristop uporablja npr. arhitektura x86.","Podatki se med CPE in V/I napravo lahko prena\u0161ajo vzporedno (ve\u010D bitov hkrati po lo\u010Denih linijah \u2014 hitro na kratke razdalje, a potrebuje veliko \u017Eic; nekdanja vzporedna/LPT vrata za tiskalnike) ali serijsko (bit za bitom po eni sami liniji \u2014 primerno za dalj\u0161e razdalje in manj\u0161e \u0161tevilo priklju\u010Dkov; npr. USB, SCI/UART)."]},{id:"t8",naslov:"Odtipavanje (polling) in prekinitve",diagram:"prekinitev",zaUcitelja:"Dijaki pogosto pozabijo prvi korak (CPE dokon\u010Da trenutni ukaz) in mislijo, da se prekinitev zgodi sredi izvajanja ukaza. Poudarite atomarnost strojnega ukaza \u2014 prekinitev se lahko zgodi le MED ukazi, nikoli znotraj enega.",odstavki:["Pri odtipavanju (angl. polling) glavni program v neskon\u010Dni zanki neprekinjeno preverja, ali je pri\u0161lo do dogodka. Slabost je popolna zaposlenost procesorja s preverjanjem, ve\u010Dja poraba energije in \u010Dasovna neu\u010Dinkovitost.","Pri prekinitvah (angl. interrupts) zunanji strojni ali notranji periferni signal takoj opozori procesor na nujen dogodek (pritisk gumba, prejem podatka, varnostna napaka, \u010Dasovni iztek). Procesor lahko medtem nemoteno izvaja druge naloge, odziv pa je skoraj takoj\u0161en.","Potek prekinitve poteka v petih korakih: (1) procesor dokon\u010Da ukaz, ki se pravkar izvaja; (2) programski \u0161tevec (PC) in statusni register (SREG) se samodejno shranita na sklad; (3) procesor prebere naslov iz prekinitvene tabele (vektorja) in sko\u010Di na pripadajo\u010Do lokacijo; (4) izvede se koda prekinitvene servisne rutine (ISR); (5) ukaz za povratek (RETI) obnovi shranjeno stanje s sklada in nadaljuje glavni program."]},{id:"t9",naslov:"Serijski (SCI) in vzporedni prenos podatkov",diagram:"sci",zaUcitelja:"Pri ra\u010Dunanju hitrosti prenosa (vaja V6) dijaki pogosto pozabijo pri\u0161teti start in stop bit ter ra\u010Dunajo samo z 8 podatkovnimi biti \u2014 opozorite na to past \u017Ee pred re\u0161evanjem, ne \u0161ele pri pregledu re\u0161itve.",odstavki:["Serijski asinhroni komunikacijski vmesnik (SCI/UART) prena\u0161a podatke zaporedno, bit za bitom, po eni sami liniji, brez skupnega taktnega signala. Hitrost prenosa (baud rate) dolo\u010Da \u0161tevilo prenesenih bitov na sekundo; obe napravi v komunikaciji morata biti nastavljeni na enako hitrost.","Komunikacijski okvir (angl. frame) sestavljajo: start bit (vedno logi\u010Dna ni\u010Dla, ki naznani za\u010Detek prenosa), podatkovni biti (najpogosteje 8), izbirni paritetni bit (za osnovno odkrivanje napak) in stop bit oz. bita (logi\u010Dna enica, ki ozna\u010Duje konec okvirja).","Pri vzporednem prenosu potuje ve\u010D bitov hkrati po lo\u010Denih linijah. Je hitrej\u0161i na kratke razdalje, a je pri dalj\u0161ih povezavah ob\u010Dutljiv na \u010Dasovni zamik med linijami (angl. skew) in zahteva veliko \u017Eic/priklju\u010Dkov \u2014 zato se je uveljavil predvsem za notranje povezave in starej\u0161e naprave (npr. vzporedna/LPT vrata za tiskalnike), medtem ko so dalj\u0161e in zunanje povezave danes skoraj izklju\u010Dno serijske."]},{id:"t10",naslov:"\u010Casovniki in \u0161tevci",diagram:null,zaUcitelja:"Razlika med na\u010Dinoma '\u010Casovnik' in '\u0160tevec' zmede dijake, ker je strojno pogosto isti modul \u2014 razlika je le v viru signala (notranja ura vs. zunanji pin). \u010Ce je \u010Das, naredite mini demo PWM krmiljenja LED-diode \u2014 otipljiv rezultat (spreminjanje svetlosti) zelo pomaga pri razumevanju.",odstavki:["\u010Casovniki in \u0161tevci so strojni moduli, ki neodvisno od procesorja \u0161tejejo urine takte ali zunanje dogodke. V na\u010Dinu \u010Dasovnik modul \u0161teje notranje urine takte mikrokrmilnika in se uporablja za natan\u010Dno merjenje \u010Dasa; v na\u010Dinu \u0161tevec pa registrira zunanje fizikalne dogodke, npr. impulze senzorja na pinu.","Normalni na\u010Din \u0161teje navzgor do maksimalne vrednosti; ob prelivu (angl. overflow) spro\u017Ei prekinitev. CTC na\u010Din (Clear Timer on Compare) \u0161teje do vnaprej dolo\u010Dene primerjalne vrednosti in se takoj ponastavi na ni\u010D. PWM na\u010Din (Pulse Width Modulation) ustvarja pulzno-\u0161irinsko modulirane signale za krmiljenje porabnikov, npr. jakosti LED-diode ali hitrosti motorja."]}],jg=[{id:"v1",naslov:"Harvard ali von Neumann?",tezavnost:"lahka",naloga:`Za vsako od spodnjih trditev zapi\u0161i, ali velja za Harvardsko arhitekturo, von Neumannovo arhitekturo ali za obe:
a) Ukazi in podatki so shranjeni v lo\u010Denih pomnilnikih.
b) Uporablja en sam naslovni prostor za ukaze in podatke.
c) CPE lahko hkrati bere ukaz in dostopa do podatka.
d) Tipi\u010Dno se uporablja v enostavnih mikrokrmilnikih (npr. AVR, PIC).
e) Pojavlja se t. i. ozko grlo pri dostopu do pomnilnika.`,resitev:"a) Harvardska  b) Von Neumannova  c) Harvardska  d) Harvardska  e) Von Neumannova.",ucNamig:"Dijaki najpogosteje zamenjajo d) in e). Dodatno vpra\u0161anje za hitrej\u0161e: zakaj Harvard potrebuje lo\u010Den naslovni dekoder za vsak pomnilnik?"},{id:"v2",naslov:"Prepoznaj na\u010Din naslavljanja",tezavnost:"lahka",naloga:`Za vsak ukaz dolo\u010Di na\u010Din naslavljanja (vsebovano, takoj\u0161nje, neposredno/registrsko ali posredno registrsko):
1) NOP
2) ADDI R1, R2, #7
3) LW R1, 0(R2)
4) LOAD R1, 2000`,resitev:"1) vsebovano  2) takoj\u0161nje  3) posredno registrsko  4) neposredno.",ucNamig:"\u010Ce dijaki obti\u010Dijo pri 4), jih spomnite na razliko med 'vrednostjo v registru' in 'naslovom, zapisanim v ukazu'."},{id:"v3",naslov:"Sled izvajanja programa",tezavnost:"srednja",naloga:`Dan je program:
MOV R1, #5
MOV R2, #3
ADD R3, R1, R2
SUB R4, R3, R2

Zapi\u0161i kon\u010Dne vrednosti registrov R1, R2, R3 in R4.`,resitev:"R1 = 5, R2 = 3, R3 = R1 + R2 = 8, R4 = R3 \u2212 R2 = 5.",ucNamig:"Preverite, da dijaki pri R4 uporabijo \u017Ee posodobljeno vrednost R3 (8), ne prvotne."},{id:"v4",naslov:"CISC ali RISC?",tezavnost:"srednja",naloga:`Za vsako trditev odlo\u010Di, ali opisuje zna\u010Dilnost arhitekture CISC ali RISC:
1) Ukazi so enotne dol\u017Eine.
2) En ukaz lahko dostopa do pomnilnika in hkrati izvede aritmetiko.
3) Poudarek je na delu z registri, malo neposrednih dostopov do pomnilnika.
4) Nabor ukazov je zelo obse\u017Een in kompleksen.
5) Ve\u010Dina ukazov se izvede v enem strojnem ciklu.
6) Arhitektura x86.
7) Arhitekturi ARM in AVR.`,resitev:"1) RISC  2) CISC  3) RISC  4) CISC  5) RISC  6) CISC  7) RISC.",ucNamig:"Za razpravo s hitrej\u0161imi dijaki: zakaj sodobni x86 procesorji interno prevajajo ukaze v RISC-podobne mikrooperacije?"},{id:"v5",naslov:"Pravilni vrstni red prekinitve",tezavnost:"srednja",naloga:`Spodnji koraki obravnave prekinitve so v napa\u010Dnem vrstnem redu. Razvrsti jih pravilno (1\u20135):
\u2014 Izvedba prekinitvene servisne rutine (ISR)
\u2014 CPE dokon\u010Da trenutni strojni ukaz
\u2014 Skok na naslov iz prekinitvene tabele (vektorja)
\u2014 RETI: obnovitev stanja s sklada in nadaljevanje glavnega programa
\u2014 Shranjevanje PC in SREG na sklad`,resitev:"1) CPE dokon\u010Da trenutni strojni ukaz  2) Shranjevanje PC in SREG na sklad  3) Skok na naslov iz prekinitvene tabele (vektorja)  4) Izvedba ISR  5) RETI \u2014 obnovitev stanja in nadaljevanje.",ucNamig:"Najpogostej\u0161a napaka: dijaki pozabijo na 1. korak in mislijo, da se prekinitev zgodi 'takoj', sredi ukaza."},{id:"v6",naslov:"Hitrost prenosa pri SCI",tezavnost:"tezka",naloga:`Podatki se prena\u0161ajo pri hitrosti 9600 bit/s. Okvir sestavljajo 1 start bit, 8 podatkovnih bitov, brez paritete in 1 stop bit (skupaj 10 bitov na znak).
a) Koliko \u010Dasa (v milisekundah) traja prenos enega samega znaka?
b) Koliko znakov lahko najve\u010D prenesemo v eni sekundi?`,resitev:`a) t = 10 bitov / 9600 bit/s \u2248 1,04 ms.
b) 9600 / 10 = 960 znakov na sekundo.`,ucNamig:"Dodatno vpra\u0161anje: kaj se zgodi s \u010Dasom, \u010De dodamo paritetni bit? (11 bitov/znak, t \u2248 1,15 ms)."},{id:"v7",naslov:"Velikost naslovljivega pomnilnika",tezavnost:"tezka",naloga:`Procesor ima 16-bitno naslovno vodilo.
a) Koliko razli\u010Dnih pomnilni\u0161kih lokacij lahko naslovi?
b) \u010Ce je vsaka lokacija velika 1 bajt, kolik\u0161na je najve\u010Dja velikost naslovljivega pomnilnika?`,resitev:"a) 2^16 = 65.536 lokacij.  b) 65.536 B = 64 KiB.",ucNamig:"Raz\u0161iritev: koliko lokacij naslovi 20-bitno vodilo? (2^20 = 1.048.576 = 1 MiB \u2014 klasi\u010Den primer 8086)."},{id:"v8",naslov:"Dekodiranje formata ukaza",tezavnost:"tezka",naloga:`16-bitni ukaz je sestavljen iz polj [4 b OPCODE][4 b Rd][4 b Rs1][4 b Rs2]. Opcode 0001 pomeni ADD.
Dekodiraj ukaz zapisan v binarni obliki: 0001 0011 0001 0010 v zbirni\u0161ki zapis (mnemonik z registri).`,resitev:`OPCODE = 0001 \u2192 ADD, Rd = 0011 \u2192 R3, Rs1 = 0001 \u2192 R1, Rs2 = 0010 \u2192 R2.
Zbirni\u0161ki zapis: ADD R3, R1, R2  (R3 = R1 + R2).`,ucNamig:"\u010Ce dijaki obti\u010Dijo, naj najprej lo\u010Deno prevedejo vsako 4-bitno skupino v decimalno obliko, \u0161ele nato sestavijo mnemonik."},{id:"v9",naslov:"Odtipavanje ali prekinitev?",tezavnost:"srednja",naloga:"Mikrokrmilnik med izvajanjem zahtevnih izra\u010Dunov mora zaznati pritisk na varnostno kriti\u010Den gumb za izklop v sili in se nanj odzvati v manj kot 1 ms. Ali naj uporabimo odtipavanje ali prekinitev? Utemelji odgovor.",resitev:"Uporabimo prekinitev. Ta zagotavlja skoraj takoj\u0161en odziv ne glede na to, kaj CPE trenutno po\u010Dne, brez potrebe po nenehnem preverjanju stanja gumba. Odtipavanje bi v tem primeru pomenilo nesprejemljivo zakasnitev, saj bi se preverjanje izvedlo \u0161ele po zaklju\u010Dku (ali med) dolgotrajnih izra\u010Dunov.",ucNamig:"Odli\u010Dna vaja za razpravo o realnih primerih: protipo\u017Earni alarm, varnostno stikalo stroja, ABS v avtomobilu."},{id:"v10",naslov:"Izbira na\u010Dina \u010Dasovnika/\u0161tevca",tezavnost:"lahka",naloga:`Za vsak primer izberi ustrezen na\u010Din delovanja \u010Dasovnika/\u0161tevca:
a) Branje temperature natan\u010Dno vsakih 100 ms.
b) \u0160tetje vrtljajev kolesa prek impulznega senzorja.
c) Uravnavanje svetlosti LED-diode.`,resitev:`a) \u010Casovnik \u2014 CTC na\u010Din (natan\u010Den \u010Dasovni interval).
b) \u0160tevec \u2014 \u0161teje zunanje impulze.
c) \u010Casovnik \u2014 PWM na\u010Din.`,ucNamig:"Preverite razumevanje: gre za isti strojni modul, razlika med '\u010Dasovnikom' in '\u0161tevcem' je le v viru signala (notranja ura vs. zunanji pin)."}],gg=[{id:"o1",naslov:"Navidezna krajevna omre\u017Eja (VLAN)",diagram:"vlan",zaUcitelja:"Dijaki pogosto mislijo, da VLAN pomeni fizi\u010Dno lo\u010Dena stikala. Poudarite, da gre za logi\u010Dno lo\u010Ditev na ISTEM fizi\u010Dnem stikalu. Predlog vaje: v Cisco Packet Tracer razdelite razred v dve skupini, vsaka nastavi svoj VLAN in preveri, da brez usmerjevalnika ne moreta komunicirati.",odstavki:["VLAN (Virtual LAN) je logi\u010Dna razdelitev enega fizi\u010Dnega stikala v ve\u010D lo\u010Denih omre\u017Eij, ki med seboj privzeto ne komunicirajo. Naprave v istem VLAN-u si delijo isto emisijsko domeno (broadcast domain), \u010Deprav so lahko fizi\u010Dno priklju\u010Dene na razli\u010Dna stikala.","Vrata stikala so lahko dostopna (access) vrata, dodeljena natanko enemu VLAN-u za priklju\u010Ditev kon\u010Dne naprave, ali prehodna (trunk) vrata, ki med stikali prena\u0161ajo promet ve\u010D VLAN-ov hkrati \u2014 pri tem se vsak okvir ozna\u010Di z oznako VLAN (802.1Q tag).","Uporaba VLAN prina\u0161a ve\u010Djo varnost (lo\u010Devanje ob\u010Dutljivega prometa), la\u017Eje upravljanje (logi\u010Dne skupine ne glede na fizi\u010Dno lokacijo) in manj emisijskega prometa v velikih omre\u017Ejih."]},{id:"o2",naslov:"Naslavljanje IPv4 in podomre\u017Eja (FLSM/VLSM)",diagram:null,zaUcitelja:"Ra\u010Dunanje podomre\u017Eij je za ve\u010Dino dijakov najte\u017Eji del omre\u017Eij \u2014 vzemite si \u010Das za ve\u010D primerov na tabli, preden gredo k ra\u010Dunalnikom. Priporo\u010Damo vizualni pripomo\u010Dek (binarni zapis maske pod naslovom, lo\u010Deno pobarvan del za omre\u017Eje in del za gostitelje).",odstavki:["Naslov IPv4 je 32-bitno \u0161tevilo, zapisano v obliki \u0161tirih osmerk (npr. 192.168.1.10). Omre\u017Ena maska dolo\u010Da, kateri del naslova pripada omre\u017Eju in kateri gostitelju.","Pri FLSM (Fixed Length Subnet Mask) vsa podomre\u017Eja dobijo enako veliko masko, kar je preprosto, a pogosto potrati naslove. VLSM (Variable Length Subnet Mask) omogo\u010Da, da vsakemu podomre\u017Eju dodelimo masko glede na dejansko potrebno \u0161tevilo gostiteljev, kar prihrani naslovni prostor.","Primer: omre\u017Eje 192.168.1.0/24 lahko z VLSM razdelimo na podomre\u017Eje /27 za oddelek s 30 gostitelji in /30 za povezavo med dvema usmerjevalnikoma, namesto da bi obema z FLSM dodelili enako veliko /27 podomre\u017Eje."]},{id:"o3",naslov:"Naslavljanje IPv6",diagram:null,zaUcitelja:"Dijaki pogosto pozabijo, da lahko okraj\u0161avo '::' uporabijo SAMO ENKRAT v naslovu \u2014 dobra past za preverjanje razumevanja. Poudarite tudi, da IPv6 zaradi ogromnega naslovnega prostora praviloma ne potrebuje NAT na enak na\u010Din kot IPv4.",odstavki:["Naslov IPv6 je 128-bitno \u0161tevilo, zapisano v osmih skupinah po \u0161tiri \u0161estnajsti\u0161ke znake, lo\u010Denih z dvopi\u010Djem (npr. 2001:0db8:0000:0000:0000:ff00:0042:8329). Zapis lahko poenostavimo: v vsaki skupini izpustimo vodilne ni\u010Dle, eno samo zaporedje ni\u010Delnih skupin pa nadomestimo z dvema dvopi\u010Djema (::) \u2014 to smemo storiti le enkrat v naslovu.","Poznamo tri osnovne vrste naslovov IPv6: unicast (ena sama ciljna naprava), multicast (skupina naprav) in anycast (najbli\u017Eja naprava iz skupine). IPv6 nima naslova broadcast \u2014 njegovo vlogo prevzame multicast.","Ker preklop na IPv6 poteka postopoma, morajo omre\u017Eja pogosto podpirati sobivanje obeh razli\u010Dic (dual stack), pri \u010Demer ima naprava hkrati dodeljen naslov IPv4 in IPv6."]},{id:"o4",naslov:"Dinami\u010Dno dodeljevanje naslovov: DHCP in NAT",diagram:["dhcp","nat"],zaUcitelja:"Zme\u0161njava: dijaki pogosto me\u0161ajo DHCP (dodeljevanje naslova) in DNS (prevajanje imena) \u2014 naredite jasno lo\u010Dnico. Pri NAT poudarite razliko med stati\u010Dnim NAT (1 : 1) in NAT overload/PAT (mnogo : 1, lo\u010Devanje s \u0161tevilkami vrat).",odstavki:["DHCP (Dynamic Host Configuration Protocol) napravam v omre\u017Eju samodejno dodeli naslov IP, masko, privzeti prehod in naslove DNS stre\u017Enikov. Postopek poteka v \u0161tirih korakih, znanih pod kratico DORA: Discover (odjemalec i\u0161\u010De stre\u017Enik), Offer (stre\u017Enik ponudi naslov), Request (odjemalec zahteva ponujeni naslov), Acknowledge (stre\u017Enik potrdi dodelitev).","NAT (Network Address Translation) prevaja zasebne naslove IP (npr. iz obsega 192.168.0.0/16) v en ali ve\u010D javnih naslovov ob prehodu v internet. Tako lahko veliko naprav v lokalnem omre\u017Eju souporablja en sam javni naslov IP, kar var\u010Duje z omejenim naborom javnih naslovov IPv4 in hkrati skriva zgradbo notranjega omre\u017Eja."]},{id:"o5",naslov:"Usmerjanje v hrbteni\u010Dnih omre\u017Ejih: MPLS in SD-WAN",diagram:null,zaUcitelja:"Tema je precej abstraktna in specializirana (podjetni\u0161ka omre\u017Eja) \u2014 zado\u0161\u010Da konceptualno razumevanje, ne pri\u010Dakujte, da bodo dijaki znali konfigurirati MPLS. Dober pristop: SD-WAN primerjajte z navigacijo, ki sproti izbira najhitrej\u0161o pot med ve\u010D mo\u017Enimi cestami.",odstavki:["MPLS (Multiprotocol Label Switching) pospe\u0161i usmerjanje v hrbteni\u010Dnih omre\u017Ejih tako, da paketom ob vstopu doda kratko oznako (label); nadaljnje usmerjanje poteka na podlagi te oznake namesto po\u010Dasnej\u0161ega pregledovanja celotne usmerjevalne tabele.","SD-WAN (Software-Defined WAN) programsko upravlja in usmerja promet med lokacijami prek ve\u010D vrst povezav hkrati (npr. MPLS, internet, LTE) ter samodejno izbira najustreznej\u0161o pot glede na trenutne razmere. V primerjavi z MPLS je SD-WAN praviloma cenej\u0161i in prilagodljivej\u0161i, MPLS pa \u0161e vedno ponuja bolj predvidljivo kakovost storitve (QoS)."]},{id:"o6",naslov:"Prenos glasu prek IP (VoIP)",diagram:null,zaUcitelja:"Dobra prilo\u017Enost za prakti\u010Dno vajo: namestitev brezpla\u010Dnega SIP odjemalca med dvema ra\u010Dunalnikoma v u\u010Dilnici za otipljiv prikaz delovanja signalizacije in medijskega toka.",odstavki:["VoIP (Voice over IP) omogo\u010Da prenos govora prek ra\u010Dunalni\u0161kih omre\u017Eij namesto po klasi\u010Dnem telefonskem omre\u017Eju. Signalizacijski protokoli (npr. SIP) vzpostavijo in zaklju\u010Dijo klic, medijski protokoli (npr. RTP) pa prena\u0161ajo dejanski zvo\u010Dni tok.","Prednosti VoIP so ni\u017Eji stro\u0161ki klicev (predvsem mednarodnih), enostavna integracija z drugimi digitalnimi storitvami in prenosljivost. Slabosti so odvisnost od kakovosti internetne povezave, mo\u017Ene zakasnitve (latenca) in izpad ob prekinitvi napajanja ali internetne povezave."]},{id:"o7",naslov:"Omre\u017Ene storitve in stre\u017Eniki (DNS, HTTP, NFS, AD)",diagram:null,zaUcitelja:"\u010Casovno zahtevna tema, \u010De \u017Eelite dijake dejansko postaviti vse \u0161tiri stre\u017Enike \u2014 premislite, kateri sta glede na razpolo\u017Eljivo opremo in \u010Das najbolj hvale\u017Ena za demonstracijo (praviloma DHCP in DNS).",odstavki:["DNS (Domain Name System) prevaja pomnljiva domenska imena (npr. www.solacenter.si) v numeri\u010Dne naslove IP, ki jih uporabljajo omre\u017Ene naprave.","HTTP stre\u017Enik stre\u017Ee spletne strani odjemalcem (brskalnikom); NFS (Network File System) omogo\u010Da souporabo datotek prek omre\u017Eja, kot bi bile lokalne; AD (Active Directory) centralno upravlja uporabnike, ra\u010Dunalnike in pravice dostopa v domeni.","Vzpostavitev lastnega stre\u017Enika v laboratorijskem okolju dijakom poka\u017Ee, kako je videti storitev 'od znotraj', ki jo v vsakdanjem \u017Eivljenju uporabljajo, ne da bi o njej razmi\u0161ljali."]},{id:"o8",naslov:"Po\u017Earni zid (firewall)",diagram:null,zaUcitelja:"Dijaki pogosto ne lo\u010Dijo stateless in stateful po\u017Earnega zidu. Dobra analogija: stateless = varnostnik, ki vsaki\u010D znova preveri izkaznico; stateful = varnostnik, ki si zapomni, da si \u017Ee vstopil, in te brez ponovnega preverjanja pusti nazaj ven.",odstavki:["Po\u017Earni zid nadzoruje in filtrira omre\u017Eni promet med dvema omre\u017Ejema (npr. med notranjim omre\u017Ejem in internetom) na podlagi vnaprej dolo\u010Denih pravil.","Paketni filter (packet filter) preverja posamezne pakete glede na naslove IP, vrata in protokol, ne da bi si zapomnil stanje povezave. Stanjski (stateful) po\u017Earni zid si zapomni stanje vsake povezave in prepusti le promet, ki pripada \u017Ee vzpostavljeni, dovoljeni seji. Aplikacijski (proxy/next-gen) po\u017Earni zid pregleduje promet do ravni aplikacije in lahko prepozna tudi vsebino znotraj dovoljenih protokolov."]},{id:"o9",naslov:"VPN in demilitarizirana cona (DMZ)",diagram:"dmz",zaUcitelja:"Pri DMZ dijaki pogosto mislijo, da je 'bolj varna' od notranjega omre\u017Eja. Razlo\u017Eite, da je namenoma IZOLIRANA, ker je bolj izpostavljena internetu, ne ker je varnej\u0161a.",odstavki:["VPN (Virtual Private Network) prek javnega omre\u017Eja (interneta) vzpostavi \u0161ifriran navidezni tunel, prek katerega oddaljeni uporabnik ali lokacija varno dostopa do zasebnega omre\u017Eja, kot bi bila fizi\u010Dno priklju\u010Dena nanj.","DMZ (demilitarizirana cona) je lo\u010Den del omre\u017Eja, kamor namestimo stre\u017Enike, ki morajo biti dostopni iz interneta (npr. spletni ali po\u0161tni stre\u017Enik). DMZ je lo\u010Dena tako od interneta kot od notranjega, zaupanja vrednega omre\u017Eja, zato morebiten vdor v stre\u017Enik v DMZ ne pomeni samodejnega dostopa do notranjega omre\u017Eja."]},{id:"o10",naslov:"Seznami dostopa (ACL)",diagram:null,zaUcitelja:"Klasi\u010Dna napaka dijakov pri pisanju ACL: pozabijo na vrstni red pravil ali na implicitno 'zavrni vse' na koncu seznama. Priporo\u010Dena vaja: naj sami napi\u0161ejo ACL, nato jim dajte paket in naj 'ro\u010Dno' sledijo pravilom eno za drugim.",odstavki:["Seznam dostopa (Access Control List, ACL) je zaporedje pravil na usmerjevalniku ali stikalu, ki dovoljuje ali zavra\u010Da promet glede na izvorni/ciljni naslov IP, vrata in protokol.","Standardni ACL filtrira promet le na podlagi izvornega naslova IP, raz\u0161irjeni (extended) ACL pa lahko upo\u0161teva tudi ciljni naslov, protokol in vrata, kar omogo\u010Da natan\u010Dnej\u0161e nadzorovanje prometa.","Pravila v ACL se preverjajo po vrstnem redu, prvo ujemajo\u010De pravilo pa se takoj uporabi \u2014 zato je vrstni red pravil klju\u010Dnega pomena; na koncu vsakega seznama je privzeto implicitno pravilo 'zavrni vse'."]}],kg=[{id:"ov1",naslov:"Komunikacija znotraj istega VLAN-a",tezavnost:"lahka",naloga:"Ali lahko dve napravi v istem VLAN-u, ki sta priklju\u010Deni na razli\u010Dni stikali, komunicirata neposredno, brez usmerjevalnika? Utemelji odgovor.",resitev:"Da \u2014 \u010De sta stikali med seboj povezani s trunk vrati, ki prena\u0161ajo ta VLAN, lahko napravi v istem VLAN-u komunicirata neposredno na 2. plasti (preklapljanje), brez potrebe po usmerjevalniku.",ucNamig:"\u010Ce dijaki odgovorijo 'ne', jih vpra\u0161ajte, kak\u0161na je razlika med access in trunk vrati."},{id:"ov2",naslov:"VLSM \u2014 izra\u010Dun maske",tezavnost:"srednja",naloga:"Omre\u017Eju 192.168.10.0/24 \u017Eelimo z VLSM dodeliti dve podomre\u017Eji: eno za 50 gostiteljev in eno za 10 gostiteljev. Kolik\u0161na maska (zapisana kot /n) ustreza vsaki zahtevi?",resitev:`Za 50 gostiteljev potrebujemo vsaj 6 bitov za gostitelje (2^6 \u2212 2 = 62 \u2265 50) \u2192 maska /26.
Za 10 gostiteljev potrebujemo vsaj 4 bite (2^4 \u2212 2 = 14 \u2265 10) \u2192 maska /28.`,ucNamig:"Preverite vmesni korak: koliko bitov za gostitelje potrebujemo \u2014 \u0161ele nato izpeljite masko."},{id:"ov3",naslov:"Poenostavitev zapisa IPv6",tezavnost:"lahka",naloga:"Poenostavi zapis naslova IPv6: 2001:0db8:0000:0000:0000:0000:1428:57ab.",resitev:"2001:db8::1428:57ab (vodilne ni\u010Dle v vsaki skupini izpustimo, eno samo zaporedje ni\u010Delnih skupin pa nadomestimo z ::).",ucNamig:"Pogosta napaka: dijaki uporabijo '::' dvakrat v istem naslovu \u2014 to ni veljavno."},{id:"ov4",naslov:"Pravilni vrstni red postopka DHCP",tezavnost:"srednja",naloga:"Razvrsti korake DHCP postopka v pravilni vrstni red: Acknowledge, Discover, Request, Offer.",resitev:"1) Discover  2) Offer  3) Request  4) Acknowledge (kratica DORA).",ucNamig:"Mnemonik DORA si dijaki najla\u017Eje zapomnijo, \u010De ga pove\u017Eejo z iskanjem stanovanja: povpra\u0161evanje, ponudba, prijava, potrditev."},{id:"ov5",naslov:"NAT v pisarni\u0161kem omre\u017Eju",tezavnost:"srednja",naloga:"V pisarni ima 20 ra\u010Dunalnikov zasebne naslove 192.168.1.2\u2013192.168.1.21, podjetje pa ima na voljo le en javni naslov IP. Kateri mehanizem to omogo\u010Da in kako se med seboj lo\u010Dijo posamezne povezave navzven?",resitev:"Uporabi se NAT overload (PAT \u2014 Port Address Translation): vsi notranji naslovi se prevedejo v isti javni naslov, posamezne seje pa se med seboj lo\u010Dijo z razli\u010Dnimi izvornimi vrati (port).",ucNamig:"Poudarite razliko med splo\u0161nim pojmom NAT in konkretno izvedbo PAT/NAT overload z vrati."},{id:"ov6",naslov:"MPLS ali SD-WAN?",tezavnost:"tezka",naloga:`Za vsako trditev odlo\u010Di, ali opisuje MPLS ali SD-WAN:
a) Promet usmerja glede na kratko oznako (label).
b) Programsko izbira najustreznej\u0161o od ve\u010D vrst povezav (internet, LTE, MPLS).
c) Ponuja bolj predvidljivo kakovost storitve (QoS).
d) Praviloma cenej\u0161i in prilagodljivej\u0161i.`,resitev:"a) MPLS  b) SD-WAN  c) MPLS  d) SD-WAN.",ucNamig:"Vaja je bolj konceptualna \u2014 dovolj je, da dijaki razumejo razliko v filozofiji, ne v podrobnostih izvedbe."},{id:"ov7",naslov:"Izbira ustreznega po\u017Earnega zidu",tezavnost:"srednja",naloga:"Podjetje potrebuje po\u017Earni zid, ki bo prepustil odgovor na spletno zahtevo, ki jo je uporabnik sam spro\u017Eil, ne bo pa dovolil nobenega nepro\u0161enega dohodnega prometa. Kateri tip po\u017Earnega zidu to omogo\u010Da in zakaj?",resitev:"Stanjski (stateful) po\u017Earni zid \u2014 ta si zapomni, da je bila povezava vzpostavljena od znotraj, in samodejno prepusti pripadajo\u010D odgovor, medtem ko nepro\u0161en dohodni promet, ki ne pripada nobeni znani seji, zavrne.",ucNamig:"Za naprednej\u0161e dijake dodajte vpra\u0161anje: kako bi to izvedli s preprostim paketnim filtrom brez stanja? (Odgovor: te\u017Eko, ker ta ne pozna konteksta seje.)"},{id:"ov8",naslov:"Kam namestiti javni spletni stre\u017Enik?",tezavnost:"srednja",naloga:"Podjetje \u017Eeli gostiti javno dostopen spletni stre\u017Enik, hkrati pa ne \u017Eeli tvegati, da bi morebiten vdor vanj ogrozil notranje omre\u017Eje z zaupnimi podatki. Kam naj namesti spletni stre\u017Enik in zakaj?",resitev:"V DMZ (demilitarizirano cono) \u2014 ta je lo\u010Dena tako od interneta kot od notranjega omre\u017Eja, zato morebiten vdor v spletni stre\u017Enik napadalcu ne omogo\u010Di neposrednega dostopa do notranjega, zaupanja vrednega omre\u017Eja.",ucNamig:"Pogosta napa\u010Dna trditev dijakov: 'DMZ je varnej\u0161a cona.' Poudarite, da je namenoma izpostavljena, ne varnej\u0161a."},{id:"ov9",naslov:"Vrstni red pravil ACL",tezavnost:"tezka",naloga:`Skrbnik je na usmerjevalnik zapisal pravila ACL v tem vrstnem redu:
1) Dovoli ves promet iz omre\u017Eja 192.168.1.0/24
2) Zavrni promet z naslova 192.168.1.50
Ali bo naprava z naslovom 192.168.1.50 lahko dostopala do omre\u017Eja? Utemelji z upo\u0161tevanjem vrstnega reda pravil ACL.`,resitev:"Da, dostopala bo lahko. Pravila ACL se preverjajo po vrstnem redu in uporabi se prvo ujemajo\u010De pravilo. Ker paket iz 192.168.1.50 najprej ustreza \u0161ir\u0161emu pravilu 1 (dovoli ves promet iz 192.168.1.0/24), se dovoli, pravilo 2 pa se sploh ne preveri. Za pravilno delovanje bi moralo biti pravilo 'zavrni 192.168.1.50' zapisano PRED splo\u0161nim dovoljenjem.",ucNamig:"Klju\u010Dna vaja za razumevanje vrstnega reda ACL \u2014 po potrebi jo predelajte na tabli korak za korakom."},{id:"ov10",naslov:"Prepoznaj omre\u017Eno storitev",tezavnost:"lahka",naloga:`Pove\u017Ei storitev s pravilnim opisom: DNS, DHCP, NFS, AD.
a) Samodejno dodeljuje naslove IP napravam.
b) Prevaja domenska imena v naslove IP.
c) Omogo\u010Da souporabo datotek prek omre\u017Eja.
d) Centralno upravlja uporabnike in pravice v domeni.`,resitev:"a) DHCP  b) DNS  c) NFS  d) AD.",ucNamig:"Hitro preverjanje razumevanja osnovnih storitev \u2014 primerno za uvod ali zaklju\u010Dek ure."}],zg=[{id:"s1",naslov:"Zagon ra\u010Dunalnika: BIOS in UEFI",diagram:"boot",zaUcitelja:"Dijaki pogosto me\u0161ajo BIOS/UEFI z operacijskim sistemom samim \u2014 poudarite, da gre za programsko opremo, vgrajeno v mati\u010Dno plo\u0161\u010Do, lo\u010Deno od OS na disku. \u010Ce je mogo\u010De, med uro na dejanskem ra\u010Dunalniku odprite meni BIOS/UEFI (tipka F2/DEL/ESC ob zagonu) za konkreten prikaz.",odstavki:["Ob vklopu ra\u010Dunalnika najprej ste\u010De POST (Power-On Self-Test) \u2014 hitro preverjanje osnovne strojne opreme (pomnilnika, procesorja, klju\u010Dnih vodil). Sledi iskanje zagonskega medija in nalaganje zagonskega nalagalnika (bootloaderja), ki nato v pomnilnik nalo\u017Ei jedro operacijskega sistema.","BIOS (starej\u0161i, uporablja particijsko tabelo MBR) in UEFI (sodobnej\u0161i, uporablja GPT) opravljata podobno vlogo \u2014 inicializacijo strojne opreme pred predajo nadzora operacijskemu sistemu \u2014 a se razlikujeta po hitrosti zagona, podpori diskom nad 2 TiB in dodatnih varnostnih mehanizmih (npr. Secure Boot pri UEFI, ki preveri digitalni podpis zagonske programske opreme).","V nastavitvah BIOS/UEFI lahko spreminjamo vrstni red zagonskih medijev, omogo\u010Dimo ali onemogo\u010Dimo posamezne strojne komponente in nastavljamo osnovne parametre delovanja strojne opreme (npr. takt procesorja, \u010Dasovnik zaganjanja)."]},{id:"s2",naslov:"Posel, proces in nit",diagram:null,zaUcitelja:"Razlika med procesom in nitjo je za dijake abstraktna. Analogija: proces je restavracija (ima svoje prostore in vire), niti so natakarji v njej, ki si delijo isto kuhinjo (pomnilnik), a lahko hkrati stre\u017Eejo razli\u010Dne mize.",odstavki:["Posel (job) je \u0161ir\u0161i pojem \u2014 enota dela, ki jo je treba opraviti (npr. tiskalni\u0161ko opravilo). Proces je program v izvajanju: ima svoj naslovni prostor, sklad in stanje. Nit (thread) je najmanj\u0161a enota izvajanja znotraj procesa \u2014 ve\u010D niti istega procesa si deli isti naslovni prostor in pomnilnik, a ima vsaka svoj sklad in programski \u0161tevec.","Ve\u010Dnitnost (multithreading) omogo\u010Da, da program hkrati izvaja ve\u010D opravil (npr. brskalnik hkrati nalaga sliko in se odziva na klike uporabnika), kar bolje izkoristi ve\u010Djedrne procesorje in izbolj\u0161a odzivnost programa, obenem pa zahteva skrbno usklajevanje dostopa do skupnih podatkov (sinhronizacijo)."]},{id:"s3",naslov:"Razvr\u0161\u010Danje procesov (Scheduling)",diagram:null,zaUcitelja:"Priporo\u010Damo, da dijaki na papirju ro\u010Dno 'simulirajo' vsaj FCFS in Round Robin za 3\u20134 izmi\u0161ljene procese in nari\u0161ejo \u010Dasovnico (Gantt) \u2014 bistveno bolje razumejo razliko kot le iz definicij.",odstavki:["Razvr\u0161\u010Devalnik (scheduler) odlo\u010Da, kateri od pripravljenih procesov v \u010Dakalni vrsti bo naslednji dobil procesorski \u010Das. FCFS (First Come, First Served) postre\u017Ee procese v vrstnem redu prihoda \u2014 preprost, a lahko povzro\u010Di dolgo \u010Dakanje kratkega opravila za dolgim.","SJF (Shortest Job First) najprej izvede najkraj\u0161e opravilo in tako v povpre\u010Dju zmanj\u0161a \u010Dakalni \u010Das, a zahteva poznavanje (ali oceno) trajanja opravila vnaprej. Kro\u017Eno postre\u017Eje (Round Robin) vsakemu procesu dodeli enak \u010Dasovni izsek (kvant), nato preide na naslednjega \u2014 pravi\u010Dno, primerno za interaktivne sisteme. Prioritetno razvr\u0161\u010Danje najprej izvede proces z najvi\u0161jo prioriteto, kar lahko pri nizko prioritetnih procesih povzro\u010Di stradanje (starvation)."]},{id:"s4",naslov:"Problem smrtnega objema (Deadlock)",diagram:"deadlock",zaUcitelja:"Dobra analogija za smrtni objem: dva avtomobila na ozkem mostu, ki se sre\u010Data iz nasprotnih smeri, in noben se ne more umakniti. Preverite, da dijaki znajo na\u0161tet vse \u0161tiri pogoje na pamet \u2014 pogosto pozabijo 'brez prekinitve dodelitve'.",odstavki:["Smrtni objem nastane, ko dva ali ve\u010D procesov medsebojno \u010Daka na vire, ki jih drug drugemu blokirajo, in noben od njih ne more nadaljevati z izvajanjem.","Za nastanek smrtnega objema morajo hkrati veljati \u0161tirje pogoji: vzajemna izklju\u010Denost (vir lahko uporablja le en proces naenkrat), zadr\u017Eevanje in \u010Dakanje (proces zadr\u017Euje vir, medtem ko \u010Daka na drugega), brez prekinitve dodelitve (vira ne moremo prisilno odvzeti) in kro\u017Eno \u010Dakanje (veriga procesov, kjer vsak \u010Daka na vir naslednjega).","Smrtni objem prepre\u010Dimo tako, da onemogo\u010Dimo enega od \u0161tirih pogojev (npr. z urejenim vrstnim redom zahtevanja virov), ga odkrijemo z algoritmom za odkrivanje kro\u017Enega \u010Dakanja, ali pa ga dovolimo in v skrajnem primeru prekinemo enega od udele\u017Eenih procesov."]},{id:"s5",naslov:"Upravljanje pomnilnika: MMU in naslovno dekodiranje",diagram:"mmu",zaUcitelja:"MMU je ena najte\u017Ejih tem v tem sklopu. Uporabite analogijo s kazalom v knjigi: logi\u010Dni naslov je 'stran v mojem osebnem izvodu knjige', MMU pa to prevede v dejansko fizi\u010Dno stran v skupni knji\u017Eni\u010Dni izdaji.",odstavki:["Enota za upravljanje s pomnilnikom (MMU, Memory Management Unit) prevaja logi\u010Dne (navidezne) naslove, ki jih uporablja program, v fizi\u010Dne naslove v dejanskem pomnilniku. To omogo\u010Da, da vsak proces 'misli', da ima na voljo cel naslovni prostor zase, \u010Deprav si fizi\u010Dni pomnilnik dejansko deli z drugimi procesi.","Prevajanje poteka s pomo\u010Djo tabele strani (page table): logi\u010Dni naslov se razdeli na \u0161tevilko strani in odmik znotraj strani; MMU s pomo\u010Djo tabele poi\u0161\u010De, kateri fizi\u010Dni okvir (frame) ustreza tej strani, in sestavi kon\u010Dni fizi\u010Dni naslov.","Naslovno dekodiranje je postopek, s katerim strojna oprema iz naslova na naslovnem vodilu ugotovi, katera pomnilni\u0161ka ali V/I komponenta je naslovljena \u2014 vsaka komponenta 'poslu\u0161a' le naslove znotraj svojega dodeljenega obsega."]},{id:"s6",naslov:"Datote\u010Dni sistem in organizacija diska",diagram:null,zaUcitelja:"Za la\u017Ejo predstavo nari\u0161ite vse tri na\u010Dine zapisa (sklenjeni/kazal\u010Dni/indeksni) za isto majhno datoteko na tablo, vzporedno drug ob drugem \u2014 vizualna primerjava je u\u010Dinkovitej\u0161a od zaporedne besedne razlage.",odstavki:["Fizi\u010Dna organizacija diska opisuje dejansko postavitev podatkov na nosilcu (sektorji, sledi, gru\u010De/clusters), logi\u010Dna organizacija pa na\u010Din, kako datote\u010Dni sistem te fizi\u010Dne enote predstavi uporabniku kot datoteke in mape.","Sklenjeni (contiguous) na\u010Din zapi\u0161e datoteko v zaporedne, sosednje gru\u010De \u2014 hiter dostop, a te\u017Eave pri rasti datoteke in nagnjenost k fragmentaciji. Kazal\u010Dni (linked) na\u010Din pove\u017Ee gru\u010De datoteke v verigo s kazalci na naslednjo gru\u010Do \u2014 brez zunanje fragmentacije, a po\u010Dasen naklju\u010Dni dostop. Indeksni (indexed) na\u010Din zbere vse kazalce na gru\u010De datoteke v lo\u010Denem indeksnem bloku \u2014 omogo\u010Da hiter naklju\u010Dni dostop brez omejitev sklenjenega zapisa (ta pristop uporabljajo sodobni datote\u010Dni sistemi, npr. NTFS, ext4)."]},{id:"s7",naslov:"Fragmentacija in upravljanje prostega prostora",diagram:null,zaUcitelja:"\u010Ce je na voljo star ra\u010Dunalnik s klasi\u010Dnim trdim diskom (HDD), v \u017Eivo prika\u017Eite orodje za defragmentacijo (vizualni prikaz premikanja del\u010Dkov) \u2014 eno redkih mest v predmetu, kjer je 'notranje delovanje' diska neposredno vidno.",odstavki:["Zunanja fragmentacija nastane, ko je prost prostor na disku razpr\u0161en v majhne, nesosednje ko\u0161\u010Dke, tako da kljub dovolj velikemu skupnemu prostemu prostoru ni dovolj velikega sklenjenega kosa za novo datoteko. Notranja fragmentacija nastane, ko dodeljena gru\u010Da presega dejansko velikost podatkov in preostanek gru\u010De ostane neizkori\u0161\u010Den.","Defragmentacija premesti dele datotek tako, da postanejo spet zaporedni (sklenjeni) na disku, kar pospe\u0161i dostop \u2014 pri klasi\u010Dnih trdih diskih (HDD) je smiselna, pri SSD-jih pa praviloma ni potrebna in lahko celo skraj\u0161a \u017Eivljenjsko dobo pomnilni\u0161kih celic.","Prost prostor na disku sledimo npr. z bitnim vektorjem (en bit za vsako gru\u010Do \u2014 zaseden/prost) ali s povezanim seznamom prostih gru\u010D."]},{id:"s8",naslov:"RAID \u2014 na\u010Dini shranjevanja podatkov",diagram:"raid",zaUcitelja:"Dijaki pogosto mislijo, da je RAID 'varnostna kopija'. Poudarite klju\u010Dno razliko: RAID \u0161\u010Diti pred okvaro diska, ne pred izbrisom datoteke, virusom ali \u010Dlove\u0161ko napako \u2014 za to je \u0161e vedno potrebna lo\u010Dena varnostna kopija.",odstavki:["RAID (Redundant Array of Independent Disks) zdru\u017Ei ve\u010D fizi\u010Dnih diskov v eno logi\u010Dno enoto zaradi ve\u010Dje hitrosti, zanesljivosti ali obojega.","RAID 0 (striping) podatke razporedi izmeni\u010Dno po vseh diskih brez redundance \u2014 najve\u010Dja hitrost, a odpoved enega diska pomeni izgubo vseh podatkov. RAID 1 (mirroring) podatke podvoji na dveh diskih \u2014 visoka zanesljivost, a polovica kapacitete je porabljena za kopijo. RAID 5 uporablja porazdeljeno paritetno informacijo prek vseh diskov (najmanj 3) \u2014 omogo\u010Da obnovitev podatkov ob odpovedi enega diska, ob tem pa porabi manj prostora za redundanco kot RAID 1."]},{id:"s9",naslov:"Vrste operacijskih sistemov in virtualizacija",diagram:null,zaUcitelja:"Pove\u017Eite z izbirnim sklopom o virtualizaciji, \u010De ga je razred \u017Ee predelal. Dobra demonstracija: v \u017Eivo za\u017Eenite VirtualBox in poka\u017Eite, da gostujo\u010Di OS 'ne ve', da te\u010De znotraj drugega ra\u010Dunalnika.",odstavki:["Stre\u017Eni\u0161ki operacijski sistem je optimiziran za zanesljivost, varnost in souporabo virov med ve\u010D uporabniki oz. storitvami (npr. Windows Server, stre\u017Eni\u0161ke distribucije Linuxa), medtem ko operacijski sistem v realnem \u010Dasu (RTOS) zagotavlja predvidljiv, zajam\u010Den odzivni \u010Das \u2014 klju\u010Dno za vgrajene in nadzorne sisteme (npr. industrijska avtomatizacija, avtomobilska elektronika).","Navidezno okolje (virtualizacija) omogo\u010Da, da en fizi\u010Dni ra\u010Dunalnik gosti ve\u010D navideznih ra\u010Dunalnikov hkrati, vsak s svojim (gostujo\u010Dim) operacijskim sistemom. Hipervizor tipa 1 (bare-metal) te\u010De neposredno na strojni opremi (npr. VMware ESXi, Hyper-V), hipervizor tipa 2 pa te\u010De kot aplikacija znotraj gostiteljskega operacijskega sistema (npr. VirtualBox, VMware Workstation)."]},{id:"s10",naslov:"Ukazna lupina, ukazne datoteke in varnost podatkov",diagram:null,zaUcitelja:"Pri varnostnih kopijah naredite konkreten ra\u010Dunski primer (npr. koliko prostora prihrani prirastna kopija v primerjavi z diferencialno \u010Dez teden dni) \u2014 abstraktne definicije same po sebi dijakom malo pomenijo.",odstavki:["Ukazna lupina (shell) omogo\u010Da neposredno upravljanje operacijskega sistema z besedilnimi ukazi. Napredni ukazi omogo\u010Dajo preusmerjanje vhoda/izhoda, veri\u017Eenje ukazov (cevi, angl. pipes) in delo s spremenljivkami okolja. Ukazna datoteka (skripta) zdru\u017Ei zaporedje ukazov v eno samo datoteko, ki jo lahko poganjamo ponovljivo in avtomatizirano.","Varnostna kopija (backup) je nujna za\u0161\u010Dita pred izgubo podatkov. Polna (full) kopija shrani vse podatke, prirastna (incremental) le spremembe od zadnje kopije (hitreje, a obnovitev zahteva verigo kopij), diferencialna (differential) pa vse spremembe od zadnje polne kopije (po\u010Dasnej\u0161a izdelava kot prirastna, a hitrej\u0161a in enostavnej\u0161a obnovitev).","Za\u0161\u010Dita dostopa do podatkov vklju\u010Duje uporabni\u0161ka dovoljenja in pravice (kdo sme brati/pisati/izvajati), gesla in ve\u010Dfaktorsko avtentikacijo ter \u0161ifriranje podatkov na nosilcu, kar prepre\u010Di dostop tudi v primeru fizi\u010Dne kraje diska."]}],bg=[{id:"sv1",naslov:"BIOS ali UEFI?",tezavnost:"lahka",naloga:`Za vsako trditev odlo\u010Di, ali velja za BIOS, UEFI ali za oba:
a) Uporablja particijsko tabelo GPT.
b) Uporablja particijsko tabelo MBR.
c) Je programska oprema, vgrajena v mati\u010Dno plo\u0161\u010Do, ki pripravi strojno opremo pred zagonom OS.
d) Podpira funkcijo Secure Boot.`,resitev:"a) UEFI  b) BIOS  c) oba  d) UEFI.",ucNamig:"Pogosta zmeda: dijaki mislijo, da je BIOS/UEFI operacijski sistem. Poudarite lo\u010Dnico."},{id:"sv2",naslov:"Proces ali nit?",tezavnost:"lahka",naloga:`Za vsak opis odlo\u010Di, ali gre za proces ali nit:
a) Ima svoj lasten naslovni prostor.
b) Si deli pomnilnik z drugimi enotami znotraj istega programa.
c) Brskalnik hkrati nalaga sliko in se odziva na klik mi\u0161ke.`,resitev:"a) proces  b) nit  c) nit (dve niti znotraj istega procesa brskalnika).",ucNamig:"\u010Ce dijaki obti\u010Dijo, uporabite restavracijsko analogijo iz teorije (proces = restavracija, niti = natakarji)."},{id:"sv3",naslov:"Simulacija Round Robin",tezavnost:"srednja",naloga:"Trije procesi P1 (potreben \u010Das 6), P2 (4) in P3 (2) prispejo hkrati. Razvr\u0161\u010Devalnik uporablja Round Robin s kvantom 2. Opi\u0161i vrstni red izvajanja in \u010Das, ob katerem se vsak proces zaklju\u010Di.",resitev:`Vrstni red: P1(0\u20132), P2(2\u20134), P3(4\u20136, zaklju\u010Den), P1(6\u20138), P2(8\u201310, zaklju\u010Den), P1(10\u201312, zaklju\u010Den).
P3 se zaklju\u010Di ob t = 6, P2 ob t = 10, P1 ob t = 12.`,ucNamig:"Dobra vaja za tablo \u2014 naj dijaki sami nari\u0161ejo Gantt diagram, preden poka\u017Eete re\u0161itev."},{id:"sv4",naslov:"Pogoji za smrtni objem",tezavnost:"srednja",naloga:"Na\u0161tej vse \u0161tiri pogoje, ki morajo veljati hkrati za nastanek smrtnega objema, in vsakega na kratko razlo\u017Ei.",resitev:`1) Vzajemna izklju\u010Denost \u2014 vir lahko uporablja le en proces naenkrat.
2) Zadr\u017Eevanje in \u010Dakanje \u2014 proces zadr\u017Euje \u017Ee dodeljen vir, medtem ko \u010Daka na drugega.
3) Brez prekinitve dodelitve \u2014 vira procesu ne moremo prisilno odvzeti.
4) Kro\u017Eno \u010Dakanje \u2014 obstaja veriga procesov, kjer vsak \u010Daka na vir, ki ga zadr\u017Euje naslednji v verigi.`,ucNamig:"Preverite, da znajo dijaki na pamet na\u0161tet vse \u0161tiri pogoje \u2014 pogosto vpra\u0161anje na pisnem preverjanju."},{id:"sv5",naslov:"Prepoznaj smrtni objem",tezavnost:"tezka",naloga:"Proces A zadr\u017Euje tiskalnik in zahteva opti\u010Dni pogon. Proces B zadr\u017Euje opti\u010Dni pogon in zahteva tiskalnik. Ali gre za smrtni objem? Utemelji s pogoji iz prej\u0161nje vaje.",resitev:"Da, gre za smrtni objem \u2014 izpolnjeni so vsi \u0161tirje pogoji: vira (tiskalnik, opti\u010Dni pogon) lahko uporablja le en proces (vzajemna izklju\u010Denost), vsak proces zadr\u017Euje en vir in \u010Daka na drugega (zadr\u017Eevanje in \u010Dakanje), virov ni mogo\u010De prisilno odvzeti, obstaja pa kro\u017Ena veriga \u010Dakanja A \u2192 opti\u010Dni pogon \u2192 B \u2192 tiskalnik \u2192 A.",ucNamig:"Odli\u010Dna nadgradnja prej\u0161nje vaje \u2014 preveri, ali dijaki znajo pogoje UPORABITI na konkretnem primeru, ne le na\u0161teti."},{id:"sv6",naslov:"Prevajanje naslova v MMU",tezavnost:"tezka",naloga:"Sistem uporablja strani velikosti 4 KiB (4096 B). Logi\u010Dni naslov procesa je 10 000. V kateri strani (\u0161tevilka strani) se nahaja ta naslov in kolik\u0161en je odmik (offset) znotraj strani?",resitev:`\u0160tevilka strani = \u230A10 000 / 4096\u230B = 2.
Odmik = 10 000 \u2212 (2 \xD7 4096) = 10 000 \u2212 8192 = 1808.
Naslov se nahaja v strani \u0161t. 2, na odmiku 1808 B.`,ucNamig:"Pogosta napaka: dijaki pozabijo na celo\u0161tevilsko deljenje (zaokro\u017Eitev navzdol) pri \u0161tevilki strani."},{id:"sv7",naslov:"Na\u010Dini zapisa datoteke",tezavnost:"lahka",naloga:`Za vsak opis navedi ustrezen na\u010Din zapisa datoteke na disk (sklenjeni, kazal\u010Dni, indeksni):
a) Vsaka gru\u010Da vsebuje kazalec na naslednjo gru\u010Do datoteke.
b) Vse gru\u010De datoteke so zapisane zaporedoma, ena za drugo.
c) Vsi kazalci na gru\u010De so zbrani v enem lo\u010Denem bloku.`,resitev:"a) kazal\u010Dni  b) sklenjeni  c) indeksni.",ucNamig:"Hitro preverjanje razumevanja \u2014 primerno za uvod v uro ali kot kratek kviz."},{id:"sv8",naslov:"Izbira nivoja RAID",tezavnost:"srednja",naloga:"Podjetje potrebuje diskovni sistem, ki bo pre\u017Eivel odpoved enega diska, hkrati pa no\u010De \u017Ertvovati polovice celotne kapacitete za redundanco (kot pri RAID 1). Kateri nivo RAID je primernej\u0161i in zakaj?",resitev:"RAID 5 \u2014 s pomo\u010Djo porazdeljene paritete omogo\u010Da obnovitev podatkov po odpovedi enega diska, hkrati pa za redundanco porabi bistveno manj prostora kot RAID 1 (kapaciteto pribli\u017Eno enega diska od najmanj treh, namesto polovice celotne kapacitete).",ucNamig:"Za razpravo: kaj bi se zgodilo pri RAID 5, \u010De bi hkrati odpovedala dva diska? (Odgovor: podatki bi bili izgubljeni \u2014 za to obstaja RAID 6.)"},{id:"sv9",naslov:"Prirastna ali diferencialna kopija?",tezavnost:"lahka",naloga:"Podjetje vsak dan naredi varnostno kopijo. V ponedeljek naredi polno kopijo. Kaj bo v torkovi kopiji, \u010De podjetje uporablja: a) prirastno (incremental), b) diferencialno (differential) kopiranje?",resitev:`a) Prirastna kopija bo vsebovala le spremembe od ponedeljkove (zadnje) kopije.
b) Diferencialna kopija bo prav tako vsebovala le spremembe od ponedeljka \u2014 v torek sta si \u0161e enaki; razlika med njima postane vidna \u0161ele v sredo in kasneje (diferencialna vedno primerja s ponedeljkom, prirastna pa vedno le z v\u010Deraj\u0161njim dnem).`,ucNamig:"Ta vaja pogosto razkrije, da dijaki diferencialno in prirastno kopiranje zamenjujejo \u2014 razlo\u017Eite razliko na primeru celega tedna, ne le za torek."},{id:"sv10",naslov:"Hipervizor tipa 1 ali 2?",tezavnost:"srednja",naloga:"Uporabnik na svojem prenosnem ra\u010Dunalniku z name\u0161\u010Denim Windows namesti VirtualBox in v njem za\u017Eene Linux. Ali gre za hipervizor tipa 1 ali tipa 2? Utemelji.",resitev:"Tipa 2 \u2014 VirtualBox te\u010De kot aplikacija znotraj obstoje\u010Dega gostiteljskega operacijskega sistema (Windows), ne neposredno na strojni opremi. Hipervizor tipa 1 bi namesto tega tekel neposredno na strojni opremi, brez vmesnega gostiteljskega OS.",ucNamig:"Za naprednej\u0161e dijake: vpra\u0161ajte za primer hipervizorja tipa 1 iz podjetni\u0161kega okolja (VMware ESXi, Hyper-V, Proxmox)."}],hg=[{id:"p1",naslov:"Objektno usmerjeno programiranje: temeljni gradniki",diagram:null,zaUcitelja:"Dijaki pogosto zamenjujejo razred in objekt. Dobra analogija: razred je gradbeni na\u010Drt hi\u0161e, objekt pa dejansko zgrajena hi\u0161a po tem na\u010Drtu \u2014 iz enega razreda lahko naredimo poljubno objektov.",odstavki:["Razred (class) je predloga oziroma na\u010Drt, ki dolo\u010Da, katere atribute (podatke) in metode (vedenje) bodo imeli objekti tega razreda. Objekt (instanca razreda) je konkreten primerek, ustvarjen po tem na\u010Drtu \u2014 vsak objekt ima svoje lastne vrednosti atributov, metode pa si deli z drugimi objekti istega razreda.","Metoda je funkcija, definirana znotraj razreda, ki opisuje vedenje objekta (npr. metoda pospesi() pri razredu Avto). Objekti med seboj komunicirajo s po\u0161iljanjem sporo\u010Dil \u2014 v praksi to pomeni klic metode enega objekta iz drugega (npr. avto1.pospesi())."]},{id:"p2",naslov:"Dedovanje in ve\u010Dobli\u010Dnost",diagram:null,zaUcitelja:"Past: dijaki me\u0161ajo preoblaganje (overloading \u2014 ista imena, razli\u010Dni parametri, odlo\u010Di se ob prevajanju) in preglasitev (overriding \u2014 podrazred na novo definira metodo nadrazreda, odlo\u010Di se med izvajanjem). Naredite jasen lo\u010Den primer za vsako.",odstavki:["Dedovanje (inheritance) omogo\u010Da, da nov razred (podrazred) prevzame atribute in metode obstoje\u010Dega razreda (nadrazreda) ter jih po potrebi raz\u0161iri ali spremeni. Tako se izognemo podvajanju kode za skupne lastnosti sorodnih razredov (npr. Avto in Motocikel oba dedujeta skupne lastnosti razreda Vozilo).","Ve\u010Dobli\u010Dnost (polymorphism) pomeni, da lahko isto ime metode v razli\u010Dnih razredih (ali z razli\u010Dnimi parametri) povzro\u010Di druga\u010Dno vedenje. Preoblaganje (overloading) pomeni ve\u010D metod z istim imenom, a razli\u010Dnimi parametri znotraj istega razreda; preglasitev (overriding) pomeni, da podrazred na novo definira metodo, podedovano od nadrazreda, z enakim podpisom."]},{id:"p3",naslov:"Ograjevanje, abstraktni razredi in vmesniki",diagram:null,zaUcitelja:"Razlika med abstraktnim razredom in vmesnikom je pogosto vir zmede. Poenostavljeno pravilo za dijake: abstraktni razred uporabimo, ko si sorodni razredi delijo del skupne implementacije; vmesnik uporabimo, ko \u017Eelimo le predpisati, kaj razred mora znati, ne da bi vsiljevali skupno implementacijo.",odstavki:["Ograjevanje (enkapsulacija) skriva notranjo implementacijo razreda pred zunanjim svetom in izpostavi le nadzorovan dostop prek javnih metod (npr. get/set metod), kar \u0161\u010Diti podatke pred nepravilno uporabo in omogo\u010Da kasnej\u0161o spremembo notranje izvedbe brez vpliva na kodo, ki razred uporablja.","Abstraktni razred lahko vsebuje tako implementirane kot neimplementirane (abstraktne) metode; iz njega ne moremo neposredno ustvariti objekta, slu\u017Ei pa kot skupna osnova za podrazrede. Vmesnik (interface) predpi\u0161e le nabor metod, ki jih mora razred implementirati, brez lastne implementacije \u2014 razred lahko implementira ve\u010D vmesnikov hkrati, deduje pa lahko le od enega razreda."]},{id:"p4",naslov:"Na\u010Drtovanje: specializacija in posplo\u0161evanje",diagram:null,zaUcitelja:"Naj dijaki sami poskusijo zgraditi hierarhijo razredov za avtenti\u010Den primer iz njihovega vsakdana (npr. igra, \u0161olski urnik, knji\u017Enica) \u2014 lastna izku\u0161nja pri prepoznavanju skupnih in posebnih lastnosti utrdi razumevanje bolje kot vnaprej pripravljen primer.",odstavki:["Posplo\u0161evanje (generalization) je postopek prepoznavanja skupnih lastnosti ve\u010D sorodnih razredov in njihovega zdru\u017Eevanja v skupni nadrazred. Specializacija (specialization) je obraten postopek \u2014 iz splo\u0161nega razreda izpeljemo bolj specifi\u010Dne podrazrede z dodatnimi ali spremenjenimi lastnostmi.","Primer: razred Vozilo (splo\u0161no) ima skupne lastnosti vseh vozil (znamka, hitrost, pospesi()); iz njega specializiramo Avto (dodatna lastnost steviloVrat) in Motocikel (dodatna lastnost imaKovcek) \u2014 vsak podeduje skupne lastnosti Vozila in doda svoje specifi\u010Dne."]},{id:"p5",naslov:"UML \u2014 funkcijski diagrami (primer rabe, razredni diagram)",diagram:["primer-rabe","razredni"],zaUcitelja:"Za diagram primera rabe je klju\u010Dno razlikovati med akterjem (kdo uporablja sistem) in primerom rabe (kaj sistem po\u010Dne zanj) \u2014 dijaki pogosto v ovale zapi\u0161ejo akterje namesto funkcionalnosti. Za razredni diagram dijake vodite od preprostega (samo imena razredov in povezave) k podrobnej\u0161emu (atributi, metode, vrste relacij).",odstavki:["Diagram primera rabe (use case diagram) prikazuje funkcionalnost sistema z vidika uporabnika: akterji (osebe ali zunanji sistemi, ki uporabljajo sistem) so povezani s primeri rabe (posameznimi funkcionalnostmi, npr. 'Prijava v sistem'), ki so zamejeni z mejo sistema.","Razredni diagram (class diagram) prikazuje strukturo sistema: razrede z njihovimi atributi in metodami ter relacije med njimi. Poleg dedovanja (is-a) poznamo tudi asociacijo (splo\u0161na povezava med razredoma), agregacijo (razred 'ima' drug razred, a ta lahko obstaja tudi samostojno) in kompozicijo (razred 'ima' drug razred, ki brez njega ne more obstajati)."]},{id:"p6",naslov:"UML \u2014 diagrami obna\u0161anja (aktivnosti, sekven\u010Dni, stanja)",diagram:["sekvencni","stanja"],zaUcitelja:"Sekven\u010Dni diagram je najbolj naraven za razumevanje, \u010De ga pove\u017Eete s konkretnim scenarijem, ki so ga dijaki \u017Ee do\u017Eiveli (npr. prijava v spletno aplikacijo) \u2014 najprej naj besedno opi\u0161ejo korake, \u0161ele nato jih prevedejo v diagram.",odstavki:["Diagram aktivnosti (activity diagram) prikazuje potek dejavnosti oz. poslovne logike \u2014 podoben je klasi\u010Dnemu diagramu poteka (flowchart), a je prilagojen prikazu vzporednih tokov in odlo\u010Ditev znotraj objektno usmerjenega sistema.","Sekven\u010Dni diagram (sequence diagram) prikazuje, kako si objekti v dolo\u010Denem \u010Dasovnem zaporedju izmenjujejo sporo\u010Dila (klice metod) pri izvajanju enega scenarija \u2014 objekti so predstavljeni z navpi\u010Dnimi \u017Eivljenjskimi \u010Drtami (lifelines), sporo\u010Dila pa s pu\u0161\u010Dicami med njimi.","Diagram stanj (state diagram) prikazuje \u017Eivljenjski cikel enega objekta \u2014 v katerih stanjih se lahko nahaja in kateri dogodki (prehodi) ga premaknejo iz enega stanja v drugo, npr. naro\u010Dilo lahko preide iz stanja 'Ustvarjeno' v 'Potrjeno', 'Odposlano' ali 'Preklicano'."]},{id:"p7",naslov:"Programski projekti in razvojna orodja",diagram:null,zaUcitelja:"Preden dijaki za\u010Dnejo s samostojnim projektom, jim v \u017Eivo poka\u017Eite zgradbo praznega projekta v izbranem razvojnem okolju (kje so izvorne datoteke, knji\u017Enice, nastavitve prevajanja) \u2014 brez tega se pogosto izgubijo v strukturi map.",odstavki:["Integrirano razvojno okolje (IDE, npr. NetBeans, Visual Studio, Eclipse) zdru\u017Euje urejevalnik kode, prevajalnik/tolma\u010D, razhro\u0161\u010Devalnik in orodja za upravljanje projekta v enotnem vmesniku, kar bistveno pospe\u0161i razvoj v primerjavi z lo\u010Denimi orodji.","Programski projekt je organizirana zbirka izvornih datotek, virov (slik, konfiguracij), zunanjih knji\u017Enic in nastavitev za prevajanje oz. gradnjo (build) v kon\u010Dno izvedljivo obliko. Vrsta projekta (konzolna aplikacija, namizna aplikacija z GUI, spletna aplikacija) dolo\u010Da, katera predloga in katere knji\u017Enice so na voljo \u017Ee ob ustvarjanju projekta."]},{id:"p8",naslov:"Sistemi za nadzor razli\u010Dic in oddaljeni repozitoriji",diagram:null,zaUcitelja:"Git je za marsikaterega dijaka prva izku\u0161nja z orodjem, kjer napaka ni katastrofalna (za razliko od izbrisa datoteke) \u2014 spodbujajte jih, naj eksperimentirajo v testnem repozitoriju. Konflikte pri zdru\u017Eevanju (merge) je vredno namenoma spro\u017Eiti in skupaj re\u0161iti pri pouku, da niso presene\u010Denje pri prvem skupinskem projektu.",odstavki:["Sistem za nadzor razli\u010Dic (npr. Git) bele\u017Ei zgodovino sprememb izvorne kode skozi \u010Das, omogo\u010Da vrnitev na prej\u0161nje razli\u010Dice in vzporedno delo ve\u010D razvijalcev na istem projektu brez medsebojnega prepisovanja sprememb.","Oddaljeni repozitorij (npr. na GitHub, GitLab) je centralna kopija projekta v oblaku. Osnovni ukazi vklju\u010Dujejo: commit (shrani spremembo lokalno z opisom), push (po\u0161lje lokalne spremembe v oddaljeni repozitorij), pull (prenese spremembe drugih iz oddaljenega repozitorija) in branch (ustvari lo\u010Deno vejo za razvoj nove funkcionalnosti brez vpliva na glavno kodo).","Pri sodelovanju v delovni skupini razvijalci spremembe obi\u010Dajno predlagajo prek zahtevka za zdru\u017Eitev (pull/merge request), ki ga pregleda in odobri drug \u010Dlan skupine, preden se spremembe zdru\u017Eijo z glavno vejo kode."]},{id:"p9",naslov:"Grafi\u010Dni uporabni\u0161ki vmesnik (GUI)",diagram:null,zaUcitelja:"Pri ocenjevanju robustnosti aplikacije dijaki pogosto pozabijo testirati 'napa\u010Den' vnos uporabnika (prazno polje, besedilo namesto \u0161tevila) \u2014 to je odli\u010Dna prilo\u017Enost za razpravo o obravnavi izjem in validaciji vnosa.",odstavki:["Grafi\u010Dni uporabni\u0161ki vmesnik (GUI) sestavljajo gradniki, kot so gumbi, vnosna polja, spustni seznami in izbirniki, ki jih uporabnik upravlja z mi\u0161ko ali tipkovnico. Programiranje GUI temelji na dogodkih (event-driven programming): program v mirovanju \u010Daka na dogodke (klik, vnos), za vsak pomemben dogodek pa je definirana funkcija odziva (event handler).","Kakovost uporabni\u0161kega vmesnika presojamo po uporabnosti (ali je intuitiven in u\u010Dinkovit za uporabnika), doslednosti (podobni elementi se vedejo podobno) in dostopnosti. Robustnost aplikacije presojamo po tem, kako se odziva na nepri\u010Dakovane oz. napa\u010Dne vnose uporabnika \u2014 dobra aplikacija se ob napaki ne sesuje, temve\u010D uporabnika opozori in mu omogo\u010Di popravek."]},{id:"p10",naslov:"Povezava s podatkovno zbirko",diagram:null,zaUcitelja:"Pri prvi vaji s podatkovno zbirko dijaki pogosto pozabijo pravilno zapreti povezavo (connection) po kon\u010Danem delu \u2014 opozorite na to \u017Ee vnaprej in razlo\u017Eite, zakaj je to pomembno (omejeno \u0161tevilo hkratnih povezav, uhajanje virov).",odstavki:["Aplikacija se s podatkovno zbirko pove\u017Ee prek ustreznega gonilnika oz. programskega vmesnika (npr. JDBC za Javo, ADO.NET za C#), ki mu podamo naslov stre\u017Enika, ime zbirke ter uporabni\u0161ko ime in geslo.","Osnovne operacije nad podatki so branje (SELECT), dodajanje (INSERT), posodabljanje (UPDATE) in brisanje (DELETE) \u2014 skupaj jih pogosto ozna\u010Dujemo s kratico CRUD (Create, Read, Update, Delete). Pri delu s podatkovno zbirko je nujno obravnavati morebitne napake (npr. izgubljena povezava, neveljavna poizvedba) z ustreznim lovljenjem izjem, da aplikacija ne prekine delovanja nepri\u010Dakovano."]}],yg=[{id:"pv1",naslov:"Razred ali objekt?",tezavnost:"lahka",naloga:`Za vsak primer odlo\u010Di, ali gre za razred ali objekt:
a) Pes (splo\u0161ni opis: ima ime, pasjo pasmo, zna lajati()).
b) Rex, moj konkretni psi\u010Dek.
c) Avto (predloga z atributi znamka, hitrost).
d) Tvoj rde\u010Di Fiat Punto na dvori\u0161\u010Du.`,resitev:"a) razred  b) objekt  c) razred  d) objekt.",ucNamig:"Preverite razumevanje na dodatnem primeru iz razreda: 'Dijak' (razred) proti konkretnemu dijaku v razredu (objekt)."},{id:"pv2",naslov:"Preoblaganje ali preglasitev?",tezavnost:"srednja",naloga:`Za vsak primer odlo\u010Di, ali gre za preoblaganje (overloading) ali preglasitev (overriding):
a) Razred Pravokotnik podeduje metodo plosina() od razreda Lik in jo na novo definira za svoj primer.
b) Razred Kalkulator ima dve metodi z imenom sestej() \u2014 eno za dve cela \u0161tevila, drugo za dve decimalni \u0161tevili.`,resitev:"a) preglasitev (overriding)  b) preoblaganje (overloading).",ucNamig:"Dobra dodatna vaja: naj dijaki sami napi\u0161ejo primer preoblaganja za metodo izracunajPovrsino() z razli\u010Dnimi parametri (krog, pravokotnik)."},{id:"pv3",naslov:"Abstraktni razred ali vmesnik?",tezavnost:"tezka",naloga:"Razredi Pes, Macka in Ptica vsi 'znajo' oddajatiZvok(), a se glasovi popolnoma razlikujejo in ne obstaja skupna implementacija. Hkrati imamo razred Zival s skupnimi atributi (ime, starost) in delno skupno implementacijo (npr. metoda spi()). Kaj uporabi\u0161 za oddajatiZvok() in kaj za skupne lastnosti razreda Zival?",resitev:"Za oddajatiZvok() uporabimo vmesnik (interface), ker gre le za predpis brez skupne implementacije. Za skupne lastnosti in delno skupno vedenje razreda Zival uporabimo abstraktni razred, saj si podrazredi delijo del implementacije (atribute in metodo spi()).",ucNamig:"To je konceptualno najzahtevnej\u0161a vaja v sklopu \u2014 \u010De dijaki obti\u010Dijo, se osredoto\u010Dite le na pravilo: deljena implementacija \u2192 abstraktni razred, samo predpis \u2192 vmesnik."},{id:"pv4",naslov:"Predlagaj specializacijo",tezavnost:"lahka",naloga:"Za razred Zaposleni (splo\u0161no: ime, placa()) predlagaj dva smiselna podrazreda s specializacijo in za vsakega navedi eno dodatno, specifi\u010Dno lastnost.",resitev:"Primer re\u0161itve: Ucitelj (dodatna lastnost: predmet, ki ga pou\u010Duje) in Racunovodja (dodatna lastnost: \u0161tevilo obdelanih ra\u010Dunov). Sprejemljivi so tudi drugi smiselni podrazredi z ustrezno utemeljitvijo.",ucNamig:"Naloga je namenoma odprta \u2014 sprejmite katerikoli smiseln in utemeljen odgovor, ne le primer iz re\u0161itve."},{id:"pv5",naslov:"Prepoznaj UML relacijo",tezavnost:"srednja",naloga:`Za vsak par razredov odlo\u010Di, ali gre za dedovanje, agregacijo ali kompozicijo:
a) Avto in Motor (motor brez tega konkretnega avtomobila ne obstaja smiselno kot njegov del).
b) Univerza in \u0160tudenti (\u0161tudent lahko obstaja tudi, \u010De univerza preneha obstajati).
c) Pes je vrsta \u017Divali.`,resitev:"a) kompozicija  b) agregacija  c) dedovanje.",ucNamig:"Razlika med agregacijo in kompozicijo je subtilna tudi za profesionalne razvijalce \u2014 ne bodite preostri pri ocenjevanju, \u010De je utemeljitev smiselna."},{id:"pv6",naslov:"Razmerje med Naro\u010Dilom in Izdelkom",tezavnost:"tezka",naloga:"Za spletno trgovino \u017Eelimo modelirati razreda Narocilo in Izdelek. Naro\u010Dilo vsebuje enega ali ve\u010D izdelkov, izdelek pa lahko nastopa v ve\u010D razli\u010Dnih naro\u010Dilih neodvisno. Kateri tip povezave (asociacija, agregacija, kompozicija) najbolje opi\u0161e razmerje med Narocilo in Izdelek? Utemelji.",resitev:"Asociacija (oz. agregacija) \u2014 izdelek lahko obstaja neodvisno od katerega koli konkretnega naro\u010Dila (je v katalogu, tudi \u010De ni naro\u010Den), zato ne gre za kompozicijo, pri kateri del ne more obstajati brez celote.",ucNamig:"Namenoma je nekoliko dvoumna (asociacija proti agregaciji) \u2014 sprejmite oba odgovora, \u010De je utemeljitev pravilna."},{id:"pv7",naslov:"Prepoznaj ukaz Git",tezavnost:"lahka",naloga:`Pove\u017Ei ukaz Git z opisom: commit, push, pull, branch.
a) Ustvari lo\u010Deno vejo za razvoj nove funkcionalnosti.
b) Po\u0161lje lokalne spremembe v oddaljeni repozitorij.
c) Shrani spremembo lokalno z opisom.
d) Prenese spremembe drugih iz oddaljenega repozitorija.`,resitev:"a) branch  b) push  c) commit  d) pull.",ucNamig:"Hitro preverjanje osnovnih pojmov Git \u2014 primerno za uvod v uro pred prakti\u010Dno vajo v repozitoriju."},{id:"pv8",naslov:"Robustnost aplikacije z GUI",tezavnost:"srednja",naloga:"Dijak je izdelal aplikacijo z gumbom 'Izra\u010Dunaj', ki bere dve vnosni polji in izpi\u0161e njuno vsoto. Kaj se zgodi, \u010De uporabnik pusti eno vnosno polje prazno in klikne gumb, program pa ne obravnava te mo\u017Enosti posebej? Kako bi izbolj\u0161al robustnost aplikacije?",resitev:"Program bo verjetno vrgel izjemo (napako pri pretvorbi praznega besedila v \u0161tevilo) in se lahko nepri\u010Dakovano ustavi. Robustnost bi izbolj\u0161ali z validacijo vnosa pred izra\u010Dunom (preverjanje, ali sta polji izpolnjeni in vsebujeta veljavno \u0161tevilo) ter z lovljenjem izjem (try/catch), ki uporabnika ob napaki obvesti z razumljivim sporo\u010Dilom, namesto da se aplikacija sesuje.",ucNamig:"Odli\u010Dna prilo\u017Enost za prakti\u010Dno vajo \u2014 naj dijaki sami v \u017Eivo popravijo svojo aplikacijo, da doda validacijo."},{id:"pv9",naslov:"Prepoznaj operacijo CRUD",tezavnost:"lahka",naloga:`Za vsak stavek SQL odlo\u010Di, kateri operaciji CRUD ustreza:
a) SELECT * FROM Studenti

@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --ink: #17212B;
  --ink-soft: #4B5A68;
  --line: #DBE1E7;
  --panel: #0D1520;
  --panel-2: #121C2B;
  --panel-ink: #E7ECF2;
  --panel-soft: #93A2B3;
  --accent: #C2703D;
  --accent-deep: #9A5527;
  --accent-ink: #FFFFFF;
  --accent-soft: #F3E1D3;
  --trace: #3E9C8F;
  --trace-soft: #DCEEEC;
  --danger: #B4472F;
  --font-display: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}

.rso-root, .rso-root * { box-sizing: border-box; }

.app-shell {
  display: flex;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
}
.app-shell * { box-sizing: border-box; }

.app-loading { align-items: center; justify-content: center; }
.loading-text { font-family: var(--font-display); color: var(--ink-soft); }

/* ---------- MOBILE TOGGLE ---------- */
.mobile-toggle { display: none; }

/* ---------- SIDEBAR ---------- */
.sidebar {
  width: 300px;
  flex: none;
  background: var(--panel);
  color: var(--panel-ink);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
}
.sidebar-header { padding: 22px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.brand-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.brand-title { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.25; color: var(--panel-ink); }
.brand-sub { margin-top: 6px; font-size: 12px; color: var(--panel-soft); }

.sidebar-search { padding: 14px 20px 8px; }
.search-input {
  width: 100%;
  background: rgba(255,255,255,0.06);
